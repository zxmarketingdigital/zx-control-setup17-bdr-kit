# Evolution API (ponte com o WhatsApp) do ZX Control 7 · Setup 17.
#
# - A API só aceita conexões do próprio computador (127.0.0.1): quem está na mesma
#   rede (Wi-Fi de coworking, por exemplo) não alcança a porta 8080.
# - A imagem tem versão fixa (testada). Não troque por :latest.
# - O Postgres fica na rede interna do Docker, sem porta publicada.
# - A chave vem do dispatcher/.env (EVOLUTION_API_KEY, gerada pelo setup).
name: zx-control-7-evolution

services:
  postgres:
    image: postgres:15
    container_name: zxc7-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 20

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: zxc7-evolution-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY:?EVOLUTION_API_KEY ausente, rode o setup (node setup/setup.js) para gerar o dispatcher/.env}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: zxc7
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      QRCODE_LIMIT: "30"
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_pg_data:
  evolution_instances:
